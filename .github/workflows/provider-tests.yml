name: Provider registration tests

on:
  push:
    branches:
      - feature/provider-registration-moscow
      - test/tz4-help-support
  pull_request:
    paths:
      - bot.py
      - "admin_*.py"
      - "support_*.py"
      - requirements.txt
      - tests/test_tz4_help_admin.py
      - provider_registry.py
      - provider_ui.py
      - moderation_history.py
      - lead_moderation.py
      - tests/test_moderation_history.py
      - tests/test_lead_moderation.py
      - lead_routing.py
      - tests/test_lead_routing.py
      - provider_dispatch.py
      - tests/test_provider_dispatch.py
      - tests/test_provider_registry.py
      - .github/workflows/provider-tests.yml

jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile new modules
        run: python -m py_compile provider_registry.py provider_ui.py provider_dispatch.py lead_routing.py lead_moderation.py moderation_history.py bot.py
      - name: Test isolated registry
        run: python -m unittest discover -s tests -p 'test_*.py' -v
