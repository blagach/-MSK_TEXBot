name: Provider registration tests

on:
  push:
    branches:
      - feature/provider-registration-moscow
  pull_request:
    paths:
      - provider_registry.py
      - provider_ui.py
      - tests/test_provider_registry.py
      - .github/workflows/provider-tests.yml

jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install aiosqlite aiogram
      - name: Compile new modules
        run: python -m py_compile provider_registry.py provider_ui.py
      - name: Test isolated registry
        run: python -m unittest discover -s tests -p test_provider_registry.py -v
